<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../../game-capture.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plague Inc</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #060d06;
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #launch-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 32px 24px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .game-icon {
      font-size: 56px;
      filter: drop-shadow(0 0 18px rgba(74,222,128,0.5));
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .size-note {
      font-size: 12px;
      color: #9ca3af;
    }

    .warning-box {
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.4);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.6;
      color: #fde68a;
      text-align: left;
    }

    .warning-box strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: #fbbf24;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.1s, box-shadow 0.1s, opacity 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); opacity: 0.88; }

    .btn-normal {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      color: #e5e7eb;
    }

    .btn-normal:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.4); }

    .btn-lowram {
      background: linear-gradient(135deg, #15803d, #22c55e);
      color: #fff;
      box-shadow: 0 6px 20px rgba(34,197,94,0.35);
    }

    .btn-lowram:hover { box-shadow: 0 10px 28px rgba(34,197,94,0.5); }

    .btn-sub {
      font-size: 11px;
      font-weight: 400;
      opacity: 0.75;
    }

    .btn-lowram .btn-sub { opacity: 0.85; }

    #game-container {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
    }

    #game-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div id="launch-screen">
    <div class="game-icon">🦠</div>
    <h1>Plague Inc</h1>
    <div class="size-note">~330 MB download required</div>

    <div class="warning-box">
      <strong>⚠️ Chromebook Warning</strong>
      Some school Chromebooks with 4GB RAM may freeze or crash when running the full version.
      Try <strong>Low RAM Mode</strong> if you experience lag or crashes — it loads data
      in smaller chunks to keep memory usage lower.
    </div>

    <div class="btn-group">
      <button class="btn btn-lowram" onclick="launch('lowram')">
        ⚡ Play Low RAM Mode
        <span class="btn-sub">Recommended for Chromebooks · Sequential loading, lower resolution</span>
      </button>
      <button class="btn btn-normal" onclick="launch('normal')">
        ▶ Play Normal Version
        <span class="btn-sub">May crash on Chromebooks with low RAM</span>
      </button>
    </div>
  </div>

  <div id="game-container">
    <iframe id="game-frame" src="index.html" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>

  <script>
    function launch(mode) {
      document.getElementById('launch-screen').style.display = 'none';
      const container = document.getElementById('game-container');
      container.style.display = 'block';

      if (mode === 'lowram') {
        document.getElementById('game-frame').src = 'index-lowram.html';
      } else {
        document.getElementById('game-frame').src = 'index-normal.html';
      }
    }
  </script>

</body>
</html>
