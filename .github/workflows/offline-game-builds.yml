name: Import offline game builds

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to process
        required: false
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: offline-game-import-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  import-supported-remote-games:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout launcher pages with blob filtering
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            **/index.html
            scripts
            .github
            offline-import-report.json
          sparse-checkout-cone-mode: false
          persist-credentials: true

      - name: Import self-hosted game folders
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFLINE_IMPORT_BRANCH: ${{ inputs.branch || github.ref_name }}
          OFFLINE_IMPORT_MAX_GAMES: "30"
          OFFLINE_IMPORT_MAX_GAME_BYTES: "157286400"
          OFFLINE_IMPORT_MAX_TOTAL_BYTES: "734003200"
        run: python3 scripts/offline-import-remote-games.py
