
<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../../game-capture.js"></script>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BuildNow GG Game Files</title>
  <link rel="stylesheet" href="gameloader2020.css">
  <link rel="stylesheet" href="game-frame-overrides.css%3Fv=2.css">
  <link rel="stylesheet" href="cover-loader/cover-loader.css%3Fv=2.css">
  <script src="gameloader2020.js"></script>
  <script src="gameloader-helper.js"></script>
</head>
<body>
  <script src="cover-loader/cover-loader.js%3Fv=5"></script>
  <script>
    CoverLoader.mount({
      background: "cover-loader/background.webp",
      logo: "cover-loader/logo.webp",
      character: "cover-loader/character.webp",
      gameName: "BuildNow GG"
    });

    var options = {
      logo: "cover-loader/logo.webp",
      gameName: "BuildNow GG",
      gameNameEu: "BuildNow GG",
      gameUrl: "41246",
      allowFullscreen: true,
      locale: "en_US",
      loader: "unity2020",
      loaderOptions: {
        unityLoaderUrl: "Build/BuildNow.loader.js",
        unityConfigOptions: {
          companyName: "BuildNow",
          productName: "BuildNow GG",
          productVersion: "0.3.2",
          dataUrl: "Build/BuildNow.data.br",
          frameworkUrl: "Build/BuildNow.framework.js.br?v=2",
          codeUrl: "Build/BuildNow.wasm.br?v=2",
          streamingAssetsUrl: "StreamingAssets",
          cacheControl: function (url) {
            return /(?:^|\/)BuildNow\.data\.br(?:\?|$)/i.test(url)
              ? "immutable"
              : "no-store";
          }
        }
      }
    };

    GameInit.load(options);
  </script>
</body>
</html>
